name: Run Layout Tests

on:
    push:
        branches: [test_pipeline]

jobs:
    test:
        runs-on: self-hosted
        strategy:
            max-parallel: 12
            matrix:
              # python-version: ["3.11", "3.12", "3.13", "3.14"]
              python-version: ["3.11"]
        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Install dependencies
              run: |
                uv pip install --system gdsfactory pytest pytest-regressions

            - name: Test with pytest
              run: |
                pytest -v -s practice/test_custom_layouts.py
